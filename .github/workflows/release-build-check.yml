name: Release build check

# Dry-runs every release build leg (Linux glibc 2.17 via cargo-zigbuild, static
# musl, macOS) for both the stripped release binary and the release-debug
# binary, on PRs that can affect them. release.yml only builds on tag push,
# and its `release` job needs every leg, so a leg that only fails at release
# time would block the whole release. Both workflows call the same
# build-binaries.yml, so this check runs exactly what the release runs.

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-build-check.yml"
      - ".github/workflows/build-binaries.yml"
      - "scripts/verify-release-binary.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "**/build.rs"
      - ".cargo/**"
      - "rust-toolchain*"
      - "install.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-binaries.yml
    with:
      package: false
