name: Release build check

# Dry-runs the Linux release binary builds (glibc 2.17 via cargo-zigbuild and
# static musl) on PRs that can affect them. release.yml only builds on tag
# push, and its `release` job needs every matrix leg, so a leg that only fails
# at release time would block the whole release. The build and verify steps
# below are copied from release.yml's `build` job; keep them in sync.

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-build-check.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/fakecloud-server/Cargo.toml"
      - "install.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.17
          - name: linux-amd64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig_target: x86_64-unknown-linux-musl
          - name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            zig_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-check-${{ matrix.target }}

      - name: Install zig + cargo-zigbuild
        if: matrix.zig_target != ''
        run: |
          python3 -m pip install --user --break-system-packages "ziglang==${ZIG_VERSION}"
          cargo install --locked cargo-zigbuild --version "${CARGO_ZIGBUILD_VERSION}"
        env:
          ZIG_VERSION: "0.16.0"
          CARGO_ZIGBUILD_VERSION: "0.23.4"

      - name: Build (Linux, cargo-zigbuild)
        if: matrix.zig_target != ''
        # vendored-openssl: the RDS MySQL client links OpenSSL through
        # native-tls; vendoring builds it from source and links it statically
        # so the binary does not depend on the runner's libssl.so.3.
        # LIBZ_SYS_STATIC / LZMA_API_STATIC: build zlib / liblzma from source
        # and link them statically instead of picking up the runner's shared
        # libraries, which zig's sysroot does not see.
        env:
          LIBZ_SYS_STATIC: "1"
          LZMA_API_STATIC: "1"
        run: cargo zigbuild --release --locked --target ${{ matrix.zig_target }} --bin fakecloud --features vendored-openssl

      - name: Verify Linux binary portability
        if: matrix.zig_target != ''
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/fakecloud"
          file "$BIN"
          # The only shared objects allowed are glibc's own (musl builds have
          # none at all).
          NEEDED="$(readelf -d "$BIN" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')"
          echo "NEEDED: ${NEEDED:-<none>}"
          BAD="$(printf '%s\n' "$NEEDED" | grep -vE '^(libc|libm|libdl|libpthread|librt|libgcc_s|ld-linux-(x86-64|aarch64))\.so' | grep . || true)"
          if [ -n "$BAD" ]; then
            echo "::error::unexpected shared library dependencies: $BAD"
            exit 1
          fi
          case "${{ matrix.target }}" in
            *-musl)
              if [ -n "$NEEDED" ]; then
                echo "::error::musl build is not fully static"
                exit 1
              fi
              ;;
            *-gnu)
              # Highest GLIBC_x.y symbol version referenced must be <= 2.17.
              MAX="$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)"
              echo "max GLIBC symbol version: $MAX"
              if [ "$(printf '%s\n2.17\n' "$MAX" | sort -V | tail -1)" != "2.17" ]; then
                echo "::error::binary requires GLIBC_$MAX (> 2.17)"
                exit 1
              fi
              ;;
          esac
          "$BIN" --version

  # The opt-in `lean` profile in Cargo.toml. Builds it once when the build
  # config changes, so a change that breaks it or pushes its link past runner
  # limits shows up on the PR.
  lean:
    name: Build lean profile (linux-amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-check-lean-x86_64-unknown-linux-gnu

      - name: Install zig + cargo-zigbuild
        run: |
          python3 -m pip install --user --break-system-packages "ziglang==${ZIG_VERSION}"
          cargo install --locked cargo-zigbuild --version "${CARGO_ZIGBUILD_VERSION}"
        env:
          ZIG_VERSION: "0.16.0"
          CARGO_ZIGBUILD_VERSION: "0.23.4"

      - name: Build (lean)
        env:
          LIBZ_SYS_STATIC: "1"
          LZMA_API_STATIC: "1"
        run: cargo zigbuild --profile lean --locked --target x86_64-unknown-linux-gnu.2.17 --bin fakecloud --features vendored-openssl

      - name: Report size and start
        shell: bash
        run: |
          BIN="target/x86_64-unknown-linux-gnu/lean/fakecloud"
          ls -l "$BIN"
          echo "gzip bytes: $(gzip -c "$BIN" | wc -c)"
          "$BIN" --version
          "$BIN" --addr 127.0.0.1:4566 &
          for _ in $(seq 1 50); do curl -sf --max-time 1 http://127.0.0.1:4566/_fakecloud/health > /dev/null && break; sleep 0.2; done
          curl -sf --max-time 1 http://127.0.0.1:4566/_fakecloud/health > /dev/null
