name: Website

on:
  push:
    branches: [main]
    paths: [website/**, install.sh]
  schedule:
    - cron: "0 4,8,12,16,20,0 * * *"  # every 4 hours — publishes scheduled posts
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Zola
        run: |
          url=https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz
          for i in 1 2 3; do
            curl -fsSL "$url" | tar xz && ok=1 && break
            echo "zola download attempt $i failed; retrying"; sleep $((i * 5))
          done
          [ "${ok:-}" = 1 ] || { echo "zola download failed after 3 attempts"; exit 1; }
          sudo mv zola /usr/local/bin/

      - name: Build
        run: cd website && zola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
