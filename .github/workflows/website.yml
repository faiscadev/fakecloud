name: Website

on:
  push:
    branches: [main]
    paths: [website/**, install.sh]
  schedule:
    - cron: "0 4,8,12,16,20,0 * * *"  # every 4 hours — publishes scheduled posts
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Zola
        run: |
          url=https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz
          for i in 1 2 3; do
            curl -fsSL "$url" | tar xz && ok=1 && break
            echo "zola download attempt $i failed; retrying"; sleep $((i * 5))
          done
          [ "${ok:-}" = 1 ] || { echo "zola download failed after 3 attempts"; exit 1; }
          sudo mv zola /usr/local/bin/

      - name: Build
        run: cd website && zola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
