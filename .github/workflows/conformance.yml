name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0' # weekly Sunday 6am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      code: ${{ steps.detect.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - if: github.event_name == 'pull_request'
        id: detect
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.txt'
              - '!**/*.html'
              - '!docs/**'
              - '!website/**'
              - '!LICENSE'
              - '!.gitignore'

  conformance:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/free-disk
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@b3bd89dcd46d5f3d508436e1bf794284c155bbcc # nextest
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Disk diagnostics before build
        run: df -h

      - name: Build server
        run: cargo build --bin fakecloud

      - name: Run conformance integration tests
        run: cargo nextest run -P ci -p fakecloud-conformance --tests

      - name: Disk diagnostics after tests
        if: always()
        run: df -h

      - name: Build conformance tool
        run: cargo build -p fakecloud-conformance

      - name: Check conformance (fails if coverage drops)
        id: check
        run: |
          set -o pipefail
          cargo run -p fakecloud-conformance -- check \
            --json-out conformance-report.json \
            --markdown-summary-out conformance-summary.md \
            2>&1 | tee conformance-report.txt

      - name: Audit handwritten tests (fails if implemented action lacks a test)
        if: always() && steps.check.outcome != 'skipped'
        run: cargo run -p fakecloud-conformance -- audit

      - name: Post summary
        if: always()
        run: |
          if [ -f conformance-summary.md ]; then
            cat conformance-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report
          path: |
            conformance-report.txt
            conformance-report.json
            conformance-summary.md
          retention-days: 90
