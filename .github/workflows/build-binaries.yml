name: Build binaries

# The release binary build for every platform, shared by release.yml (tag
# push, packages and uploads the archives) and release-build-check.yml (PR
# dry run, builds and verifies only). One definition, so a PR check cannot
# drift from what the release actually builds.

on:
  workflow_call:
    inputs:
      package:
        description: 'Package the binaries and upload them as artifacts.'
        required: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Two full builds per target: the stripped binary and release-debug.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc builds link against glibc 2.17 through cargo-zigbuild
          # (the `.2.17` suffix on zig_target), not the runner's own glibc
          # (2.39 on ubuntu-24.04). A plain `cargo build` on the runner
          # produced binaries that refuse to start on Amazon Linux 2, RHEL 8,
          # Debian 11 and Ubuntu 20.04 ("GLIBC_2.3x not found"). 2.17 is the
          # oldest glibc Rust's std still supports, so the binary runs on
          # every glibc distro that is still around.
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.17
          # Fully static musl builds for Alpine and other musl distros,
          # where the glibc binary cannot run at all. install.sh picks these
          # automatically on musl systems.
          - name: linux-amd64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig_target: x86_64-unknown-linux-musl
          - name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            zig_target: aarch64-unknown-linux-musl
          - name: darwin-amd64
            runner: macos-15
            target: x86_64-apple-darwin
          - name: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild
        if: matrix.zig_target != ''
        run: |
          python3 -m pip install --user --break-system-packages "ziglang==${ZIG_VERSION}"
          cargo install --locked cargo-zigbuild --version "${CARGO_ZIGBUILD_VERSION}"
        env:
          ZIG_VERSION: "0.16.0"
          CARGO_ZIGBUILD_VERSION: "0.23.4"

      - name: Build (Linux, cargo-zigbuild)
        if: matrix.zig_target != ''
        # vendored-openssl: the RDS MySQL client links OpenSSL through
        # native-tls; vendoring builds it from source and links it statically
        # so the binary does not depend on the runner's libssl.so.3.
        # LIBZ_SYS_STATIC: build zlib from source and link it statically
        # instead of picking up the runner's shared library, which zig's
        # sysroot does not see.
        env:
          LIBZ_SYS_STATIC: "1"
        run: cargo zigbuild --release --locked --target ${{ matrix.zig_target }} --bin fakecloud --features vendored-openssl

      - name: Build (macOS)
        if: matrix.zig_target == ''
        run: cargo build --release --locked --target ${{ matrix.target }} --bin fakecloud

      - name: Verify release binary
        run: scripts/verify-release-binary.sh "target/${{ matrix.target }}/release/fakecloud" "${{ matrix.target }}"

      # Release binaries are stripped, so a panic backtrace has no function
      # names. A published release-debug binary lets anyone reproduce a crash
      # with names and line numbers, with no toolchain.
      - name: Build release-debug (Linux, cargo-zigbuild)
        if: matrix.zig_target != ''
        env:
          LIBZ_SYS_STATIC: "1"
        run: cargo zigbuild --profile release-debug --locked --target ${{ matrix.zig_target }} --bin fakecloud --features vendored-openssl

      - name: Build release-debug (macOS)
        if: matrix.zig_target == ''
        run: cargo build --profile release-debug --locked --target ${{ matrix.target }} --bin fakecloud

      - name: Verify release-debug binary
        run: scripts/verify-release-binary.sh "target/${{ matrix.target }}/release-debug/fakecloud" "${{ matrix.target }}"

      - name: Package
        if: inputs.package
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          package() {
            DIR="$1"
            mkdir -p "${DIR}"
            cp "$2" "${DIR}/fakecloud"
            cp LICENSE "${DIR}/"
            tar czf "${DIR}.tar.gz" "${DIR}"
            shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          }
          package "fakecloud-${TAG}-${{ matrix.name }}" "target/${{ matrix.target }}/release/fakecloud"
          package "fakecloud-${TAG}-${{ matrix.name }}-debug" "target/${{ matrix.target }}/release-debug/fakecloud"

      - name: Upload artifact
        if: inputs.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: fakecloud-*.tar.gz*
          if-no-files-found: error

      # The release-debug tree is a second full optimized build. Drop it
      # before rust-cache saves target/, so the cache holds one build per
      # target and stays within the runner disk and the repo cache quota.
      # release-debug therefore always builds cold; it only runs on tags and
      # on PRs that touch the build inputs.
      - name: Drop release-debug build from the cache
        if: always()
        shell: bash
        run: rm -rf "target/${{ matrix.target }}/release-debug"
