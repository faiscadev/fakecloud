name: SDK PHP

on:
  push:
    paths:
      - "sdks/php/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "sdks/php/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: sdks/php

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Isolate from ci.yml's same-named `test` job, which caches a
          # `./target` symlink (free-disk relocates it to /mnt); restoring it
          # here would dangle and break `cargo build`.
          shared-key: sdk

      - name: Build fakecloud
        run: cargo build --release
        working-directory: .

      - uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a # v2
        with:
          php-version: "8.3"
          extensions: curl, json
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

      - name: Run E2E tests
        run: |
          ../../target/release/fakecloud &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_fakecloud/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          vendor/bin/phpunit --testsuite e2e
