name: K8s Backends

on:
  push:
    branches: [main]
    paths:
      - 'crates/fakecloud-lambda/**'
      - 'crates/fakecloud-elasticache/**'
      - 'crates/fakecloud-rds/**'
      - 'crates/fakecloud-ecs/**'
      - 'crates/fakecloud-ec2/**'
      - 'crates/fakecloud-k8s/**'
      - '.github/workflows/lambda-k8s.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/fakecloud-lambda/**'
      - 'crates/fakecloud-elasticache/**'
      - 'crates/fakecloud-rds/**'
      - 'crates/fakecloud-ecs/**'
      - 'crates/fakecloud-ec2/**'
      - 'crates/fakecloud-k8s/**'
      - '.github/workflows/lambda-k8s.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  k8s-integration:
    name: K8s backend (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: fakecloud-k8s-test
          # Single node is enough — these tests exercise control-plane
          # interactions (create/list/delete pods, reap orphans by label)
          # plus exec into a real redis pod. Multi-node would just slow boot.
          wait: 120s

      - name: Pre-pull images into the cluster
        run: |
          # Docker Hub library images (bare names and their ECR Public copies
          # under docker/library) come from Google's Docker Hub mirror first:
          # anonymous ECR Public pulls hit "toomanyrequests: Data limit
          # exceeded" under load, and Docker Hub rate-limits too. The mirror
          # copy is tagged with the name the tests ask for; the original
          # registry is the fallback.
          mirror_for() {
            case "$1" in
              public.ecr.aws/docker/library/*) echo "mirror.gcr.io/library/${1#public.ecr.aws/docker/library/}" ;;
              */*) ;;
              *) echo "mirror.gcr.io/library/$1" ;;
            esac
          }
          pull() {
            for i in 1 2 3; do
              src=$(mirror_for "$1")
              if [ -n "$src" ] && docker pull -q "$src" && docker tag "$src" "$1"; then
                return 0
              fi
              docker pull "$1" && return 0
              echo "docker pull $1 attempt $i failed; retrying"; sleep $((i * 5))
            done
            echo "docker pull $1 failed after 3 attempts"; return 1
          }
          # alpine:3.20 (ECR Public name) is the ECS task-credentials
          # initContainer's default image; lambda/python:3.12 is the
          # Lambda invoke test's runtime.
          for img in registry.k8s.io/pause:3.10 redis:7-alpine postgres:16-alpine busybox:1.36 public.ecr.aws/docker/library/alpine:3.20 public.ecr.aws/lambda/python:3.12; do
            pull "$img"
            # Save the one platform that was pulled. A plain `kind load
            # docker-image` exports every platform in the manifest list, and
            # the node's `ctr import --all-platforms` then fails on layers
            # Docker's containerd image store never downloaded.
            docker save --platform linux/amd64 -o /tmp/kind-image.tar "$img"
            kind load image-archive /tmp/kind-image.tar --name fakecloud-k8s-test
            rm -f /tmp/kind-image.tar
          done

      - name: Lambda K8s integration tests
        env:
          FAKECLOUD_K8S_TEST: '1'
        run: |
          cargo test -p fakecloud-lambda \
            --features k8s-integration \
            --test k8s_integration \
            -- --test-threads=1

      - name: ElastiCache K8s integration tests
        env:
          FAKECLOUD_K8S_TEST: '1'
        run: |
          cargo test -p fakecloud-elasticache \
            --features k8s-integration \
            --test k8s_integration \
            -- --test-threads=1

      - name: RDS K8s integration tests
        env:
          FAKECLOUD_K8S_TEST: '1'
        run: |
          cargo test -p fakecloud-rds \
            --features k8s-integration \
            --test k8s_integration \
            -- --test-threads=1

      - name: ECS K8s integration tests
        env:
          FAKECLOUD_K8S_TEST: '1'
        run: |
          cargo test -p fakecloud-ecs \
            --features k8s-integration \
            --test k8s_integration \
            -- --test-threads=1

      - name: EC2 K8s integration tests
        env:
          FAKECLOUD_K8S_TEST: '1'
        run: |
          cargo test -p fakecloud-ec2 \
            --features k8s-integration \
            --test k8s_integration \
            -- --test-threads=1
