# Example: FakeCloud with a sample worker app.
#
# This compose file starts FakeCloud and a sample app that creates
# an SQS queue, sends a message, and reads it back.
#
# Usage:
#   docker compose -f examples/docker-compose.yml up

services:
  fakecloud:
    image: ghcr.io/faiscadev/fakecloud
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # enables Lambda Invoke
    # Lambda Invoke runs in a sibling container that reaches fakecloud via
    # host.docker.internal. Docker Desktop maps this automatically; native-Linux
    # Docker needs it wired explicitly (matches the top-level docker-compose.yml).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FAKECLOUD_LOG: info
    healthcheck:
      # The slim published image ships no curl/wget; use the built-in probe.
      test: ["CMD", "fakecloud", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  sample-app:
    image: amazon/aws-cli:latest
    depends_on:
      fakecloud:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://fakecloud:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "--- Creating SQS queue ---"
        aws sqs create-queue --queue-name demo-queue

        echo "--- Sending message ---"
        aws sqs send-message \
          --queue-url http://fakecloud:4566/123456789012/demo-queue \
          --message-body '{"hello": "from docker compose"}'

        echo "--- Receiving message ---"
        aws sqs receive-message \
          --queue-url http://fakecloud:4566/123456789012/demo-queue

        echo "--- Storing SSM parameter ---"
        aws ssm put-parameter --name /demo/greeting --value "hello world" --type String

        echo "--- Reading SSM parameter ---"
        aws ssm get-parameter --name /demo/greeting

        echo "--- Done ---"
