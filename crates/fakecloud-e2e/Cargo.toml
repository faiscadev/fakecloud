aws-sdk-kinesis = "1"
aws-sdk-ec2 = "1"
aws-sdk-autoscaling = "1"
aws-sdk-batch = "1"
aws-sdk-codebuild = "1"
aws-sdk-rds = "1"
aws-sdk-rdsdata = "1"
aws-sdk-elasticache = "1"
aws-sdk-cloudformation = "1"
aws-sdk-ses = "1"
aws-sdk-sesv2 = "1"
