aws-sdk-kinesisanalyticsv2 = "1"
# Pure-Rust Kafka client for the MSK data-plane produce/consume round trip.
# `default-features = false` drops the optional native compression codecs
# (zstd/lz4 link C) and TLS, leaving a portable pure-Rust build that compiles
# in every `--all-targets` job (clippy, e2e archive) without cmake or a C
# toolchain -- the round trip uses PLAINTEXT + NoCompression.
rskafka = { version = "0.5", default-features = false }
aws-sdk-cloudwatch = "=1.61.0"
tokio-postgres = "0.7"
mysql_async = "0.34"
aws-smithy-types = "1"
aws-smithy-runtime-api = "1"
aws-credential-types = "1"
aws-types = "1"
reqwest = { workspace = true }
tokio-tungstenite = "0.29"
futures-util = "0.3"
chrono = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
fakecloud-sdk = { path = "../fakecloud-sdk" }
fakecloud-testkit = { path = "../fakecloud-testkit", features = ["sdk-clients"] }
tempfile = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
mail-parser = "0.10"
rsa = { workspace = true }
rand = { workspace = true }
serde_urlencoded = "0.7"
x509-cert = { version = "0.2", features = ["pem"] }
