[package]
name = "fakecloud-ec2"
description = "Amazon EC2 implementation for FakeCloud"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
version.workspace = true

[dependencies]
fakecloud-aws = { workspace = true }
fakecloud-core = { workspace = true }
fakecloud-k8s = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
k8s-openapi = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The opt-in k8s-integration test drives a real cluster directly.
kube = { workspace = true }

[features]
# Opt-in Kubernetes integration tests (need a real cluster, e.g. `kind` with
# the test image loaded). Off by default so a casual `cargo test` doesn't try
# to reach a cluster. Run with:
#   FAKECLOUD_K8S_TEST=1 cargo test -p fakecloud-ec2 \
#       --features k8s-integration --test k8s_integration -- --test-threads=1
k8s-integration = []
