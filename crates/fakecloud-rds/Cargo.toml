[package]
name = "fakecloud-rds"
description = "Amazon RDS implementation for FakeCloud"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
version.workspace = true

[dependencies]
fakecloud-aws = { workspace = true }
fakecloud-core = { workspace = true }
fakecloud-k8s = { workspace = true }
fakecloud-persistence = { workspace = true }
k8s-openapi = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tokio-postgres = { workspace = true }
mysql_async = "0.34"
base64 = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
# The opt-in k8s-integration test drives a real cluster directly.
kube = { workspace = true }

[features]
# Opt-in integration tests needing a real Kubernetes cluster (a local
# `kind` cluster works). Run with:
#   FAKECLOUD_K8S_TEST=1 cargo test -p fakecloud-rds \
#       --features k8s-integration --test k8s_integration -- --test-threads=1
# Without the feature the test binary isn't built; with it, the first
# test hard-fails if FAKECLOUD_K8S_TEST is unset rather than silently
# skipping (see feedback_tests_never_silently_skip).
k8s-integration = []
