[package]
name = "fakecloud-conformance"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "fakecloud-conformance"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
tokio = { workspace = true }
clap = { workspace = true }
regex = "1"

[dev-dependencies]
fakecloud-conformance-macros = { path = "../fakecloud-conformance-macros" }
fakecloud-testkit = { path = "../fakecloud-testkit", features = ["sdk-clients"] }
rcgen = { workspace = true, features = ["x509-parser"] }
aws-config = "1"
aws-sdk-sqs = "1"
aws-sdk-sns = "1"
aws-sdk-eventbridge = "1"
aws-sdk-iam = "1"
aws-sdk-sts = "1"
aws-sdk-ssm = "1"
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
aws-sdk-lambda = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-cloudwatch = "=1.61.0"
aws-sdk-kms = "1"
aws-sdk-kinesis = "1"
aws-sdk-firehose = "1"
aws-sdk-rds = "1"
aws-sdk-ec2 = "1"
aws-sdk-elasticache = "1"
aws-sdk-elasticbeanstalk = "1"
aws-sdk-cloudformation = "1"
aws-sdk-sesv2 = "1"
aws-sdk-cognitoidentity = "1"
aws-sdk-cognitoidentityprovider = "1"
aws-sdk-sfn = "1"
aws-sdk-apigateway = "1"
aws-sdk-apigatewayv2 = "1"
aws-sdk-bedrock = "1"
aws-sdk-bedrockagent = "1"
aws-sdk-bedrockagentruntime = "1"
aws-sdk-bedrockruntime = "1"
aws-sdk-scheduler = "1"
aws-sdk-pipes = "1"
aws-sdk-dsql = "1"
aws-sdk-cloudcontrol = "1"
aws-sdk-resourcegroups = "1"
aws-sdk-memorydb = "1"
aws-sdk-eks = "1"
aws-sdk-resourcegroupstagging = "1"
aws-sdk-ecr = "1"
aws-sdk-ecs = "1"
aws-sdk-elasticloadbalancingv2 = "1"
aws-sdk-cloudfront = "1"
aws-sdk-route53 = "1"
aws-sdk-acm = "1"
aws-sdk-applicationautoscaling = "1"
aws-sdk-wafv2 = "1"
aws-sdk-athena = "1"
aws-sdk-glue = "1"
aws-sdk-organizations = "1"
aws-smithy-types = "1"
aws-credential-types = "1"
aws-types = "1"
tokio = { workspace = true }
zip = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }
