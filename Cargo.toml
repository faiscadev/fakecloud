[workspace]
members = [ "crates/fakecloud-account", "crates/fakecloud-acm", "crates/fakecloud-appconfig", "crates/fakecloud-apigateway", "crates/fakecloud-apigatewayv2", "crates/fakecloud-application-autoscaling", "crates/fakecloud-autoscaling", "crates/fakecloud-athena", "crates/fakecloud-aws", "crates/fakecloud-batch", "crates/fakecloud-bedrock", "crates/fakecloud-bedrock-agent", "crates/fakecloud-bedrock-agent-runtime", "crates/fakecloud-cloudcontrol", "crates/fakecloud-cloudformation", "crates/fakecloud-cloudfront", "crates/fakecloud-cloudtrail", "crates/fakecloud-ce", "crates/fakecloud-codeconnections", "crates/fakecloud-backup", "crates/fakecloud-cloudwatch", "crates/fakecloud-cognito", "crates/fakecloud-conformance", "crates/fakecloud-conformance-macros", "crates/fakecloud-core", "crates/fakecloud-dms", "crates/fakecloud-dsql", "crates/fakecloud-dynamodb", "crates/fakecloud-e2e", "crates/fakecloud-ec2", "crates/fakecloud-ecr", "crates/fakecloud-ecs", "crates/fakecloud-efs", "crates/fakecloud-eks", "crates/fakecloud-glacier", "crates/fakecloud-elasticbeanstalk", "crates/fakecloud-elasticache", "crates/fakecloud-memorydb", "crates/fakecloud-mq", "crates/fakecloud-elbv2", "crates/fakecloud-eventbridge", "crates/fakecloud-firehose", "crates/fakecloud-glue", "crates/fakecloud-iam", "crates/fakecloud-identitystore", "crates/fakecloud-ssoadmin", "crates/fakecloud-verifiedpermissions", "crates/fakecloud-kinesis", "crates/fakecloud-kms", "crates/fakecloud-k8s", "crates/fakecloud-lakeformation", "crates/fakecloud-lambda", "crates/fakecloud-logs", "crates/fakecloud-opensearch", "crates/fakecloud-organizations", "crates/fakecloud-parity", "crates/fakecloud-persistence", "crates/fakecloud-pipes", "crates/fakecloud-ram", "crates/fakecloud-rds", "crates/fakecloud-rds-data", "crates/fakecloud-redshift", "crates/fakecloud-resource-groups", "crates/fakecloud-resource-groups-tagging", "crates/fakecloud-route53", "crates/fakecloud-s3", "crates/fakecloud-s3tables", "crates/fakecloud-codebuild", "crates/fakecloud-codecommit", "crates/fakecloud-codedeploy", "crates/fakecloud-codepipeline", "crates/fakecloud-codeartifact", "crates/fakecloud-scheduler", "crates/fakecloud-sdk", "crates/fakecloud-secretsmanager", "crates/fakecloud-server", "crates/fakecloud-servicediscovery", "crates/fakecloud-ses", "crates/fakecloud-sns", "crates/fakecloud-sqs", "crates/fakecloud-ssm", "crates/fakecloud-stepfunctions", "crates/fakecloud-testkit", "crates/fakecloud-tfacc", "crates/fakecloud-transfer", "crates/fakecloud-wafv2",]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/faiscadev/fakecloud"
homepage = "https://fakecloud.dev"
rust-version = "1.94"
version = "0.38.0"

[workspace.dependencies]
cedar-policy = "4"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
chrono-tz = "0.10"
bytes = "1"
tracing = "0.1"
toml = "0.8"
percent-encoding = "2"
base64 = "0.22"
flate2 = "1"
http = "1"
tower = "0.5"
async-trait = "0.1"
parking_lot = "0.12"
md-5 = "0.10"
rand = "0.8"
rcgen = "0.13"
sha1 = "0.10"
sha2 = "0.10"
p256 = "0.13"
hmac = "0.12"
num-bigint = "0.4"
crc32c = "0.6"
crc32fast = "1"
crc64fast-nvme = "1"
zip = "2"
tempfile = "3"
regex = "1"
tokio-postgres = "0.7"
sqlparser = "0.61"

[profile.test]
debug = "line-tables-only"

# Third-party dependencies (every `aws-sdk-*` and friends — ~210 crates) dominate
# the `target` dir size and CI compile time. We don't debug into them, so strip
# their debuginfo entirely while keeping line tables for our own crates. This is
# the root-cause fix for the recurring "No space left on device" CI flake, where
# the test `target` dir alone reached 45G and filled the 72G runner disk.
[profile.test.package."*"]
debug = false

[profile.dev.package."*"]
debug = false

[workspace.dependencies.tokio]
version = "1"
features = [ "macros", "rt-multi-thread", "net", "io-util", "time", "signal", "sync", "process", "fs",]

[workspace.dependencies.tokio-util]
version = "0.7"
features = [ "io",]

[workspace.dependencies.axum]
version = "0.8"
features = [ "ws",]

[workspace.dependencies.hyper]
version = "1"
features = [ "full",]

[workspace.dependencies.serde]
version = "1"
features = [ "derive",]

[workspace.dependencies.quick-xml]
version = "0.37"
features = [ "serialize",]

[workspace.dependencies.clap]
version = "4"
features = [ "derive", "env",]

[workspace.dependencies.uuid]
version = "1"
features = [ "v4",]

[workspace.dependencies.chrono]
version = "0.4"
features = [ "serde",]

[workspace.dependencies.tracing-subscriber]
version = "0.3"
features = [ "env-filter",]

[workspace.dependencies.tower-http]
version = "0.6"
features = [ "trace",]

[workspace.dependencies.rsa]
version = "0.9"
features = [ "sha2", "pem", "pkcs5",]

[workspace.dependencies.pkcs8]
version = "0.10"
features = [ "encryption", "pem",]

[workspace.dependencies.reqwest]
version = "0.13"
features = [ "json",]

